name: Build and publish generator containers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.generator }} container
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        generator:
          - book
          - logs
          - random

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.generator }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The Dockerfile cross-compiles from BUILDPLATFORM (CGO disabled), so both arches build
          # natively on the amd64 runner - no setup-qemu step needed.
          platforms: linux/amd64,linux/arm64
          build-args: |
            CMD=${{ matrix.generator }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.generator }}
          cache-to: type=gha,mode=max,scope=${{ matrix.generator }}
