name: Build and publish generator containers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.generator }} container
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        generator:
          - agent
          - observer
          - book
          - logs
          - random

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The build image has to satisfy go.mod's go directive. The official golang images set
      # GOTOOLCHAIN=local, so a builder older than the directive fails `go mod download` outright
      # rather than fetching a newer toolchain. Deriving the tag from go.mod here means a
      # dependency bump that raises the directive cannot leave the Dockerfile's default behind.
      # The patch component is dropped so the image still floats to the newest patch release.
      - name: Resolve Go version from go.mod
        id: go
        run: |
          echo "version=$(grep -m1 '^go ' go.mod | awk '{print $2}' | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.generator }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # The Dockerfile cross-compiles from BUILDPLATFORM (CGO disabled), so both arches build
          # natively on the amd64 runner - no setup-qemu step needed.
          platforms: linux/amd64,linux/arm64
          build-args: |
            CMD=${{ matrix.generator }}
            GO_VERSION=${{ steps.go.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.generator }}
          cache-to: type=gha,mode=max,scope=${{ matrix.generator }}
